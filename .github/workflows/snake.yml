name: Gerar animação de contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#f472b6&color_dots=#1b1525,#3b2a5c,#6d3fa8,#a855f7,#f472b6
            dist/snake-light.svg?color_snake=#c026d3&color_dots=#f3e8ff,#e9d5ff,#d8b4fe,#c084fc,#a855f7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
