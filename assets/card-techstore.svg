<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img" aria-label="TechStore SQL: Análise de vendas de um e-commerce de eletrônicos com dashboard em Excel.">
  <defs>
    <linearGradient id="gk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bgk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0a1a"/><stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <pattern id="dotsk" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c084fc" opacity=".18"/>
    </pattern>
    <linearGradient id="shinek" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/><stop offset=".35" stop-color="#c084fc"/>
      <stop offset=".5" stop-color="#ffffff"/><stop offset=".65" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient><clipPath id="cl"><rect width="480" height="230" rx="16"/></clipPath></defs>
  <g clip-path="url(#cl)">
  <rect width="480" height="230" fill="url(#bgk)"/>
  <rect width="480" height="230" fill="url(#dotsk)"/>
  <circle cx="440" cy="30" r="90" fill="#c084fc" opacity=".07"><animate attributeName="r" values="80;100;80" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(24 22) scale(1.0)">
    <rect width="72" height="72" rx="14" fill="#ffffff" opacity=".05"/>
    <defs><linearGradient id="gc" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
    
    <line x1="10" y1="62" x2="64" y2="62" stroke="#c084fc" stroke-opacity=".5" stroke-width="2"/><rect x="14" width="9" rx="2" fill="#c084fc" opacity=".75"><animate attributeName="height" values="0;18;18;0" keyTimes="0;.3;.9;1" dur="4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="y" values="62;44;44;62" keyTimes="0;.3;.9;1" dur="4s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="27" width="9" rx="2" fill="#c084fc" opacity=".75"><animate attributeName="height" values="0;30;30;0" keyTimes="0;.3;.9;1" dur="4s" begin="0.15s" repeatCount="indefinite"/><animate attributeName="y" values="62;32;32;62" keyTimes="0;.3;.9;1" dur="4s" begin="0.15s" repeatCount="indefinite"/></rect><rect x="40" width="9" rx="2" fill="#c084fc" opacity=".75"><animate attributeName="height" values="0;24;24;0" keyTimes="0;.3;.9;1" dur="4s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="62;38;38;62" keyTimes="0;.3;.9;1" dur="4s" begin="0.3s" repeatCount="indefinite"/></rect><rect x="53" width="9" rx="2" fill="#c084fc" opacity=".75"><animate attributeName="height" values="0;44;44;0" keyTimes="0;.3;.9;1" dur="4s" begin="0.44999999999999996s" repeatCount="indefinite"/><animate attributeName="y" values="62;18;18;62" keyTimes="0;.3;.9;1" dur="4s" begin="0.44999999999999996s" repeatCount="indefinite"/></rect>
    <polyline points="18,40 31,28 44,34 57,12" fill="none" stroke="#f472b6" stroke-width="2.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;.3;.55;.9;1" dur="4s" repeatCount="indefinite"/></polyline></g>
  <text x="112" y="52" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">TechStore SQL</text>
  <rect x="112" y="64" width="145" height="22" rx="6" fill="#f472b6" fill-opacity=".15"/>
  <text x="184" y="79" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#f472b6">ANÁLISE DE DADOS</text>
  <text x="24" y="124" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#cfc6e2">Análise de vendas de um e-commerce de</text><text x="24" y="144" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#cfc6e2">eletrônicos com dashboard em Excel.</text>
  <rect x="24" y="184" width="41" height="24" rx="12" fill="#c084fc" fill-opacity=".12" stroke="#c084fc" stroke-opacity=".4"/><text x="44" y="200" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#e9d5ff">SQL</text><rect x="72.8" y="184" width="56" height="24" rx="12" fill="#c084fc" fill-opacity=".12" stroke="#c084fc" stroke-opacity=".4"/><text x="101" y="200" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#e9d5ff">Excel</text>
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#f472b6">
    <text x="456" y="38" text-anchor="end">abrir repositório
      <tspan>-&gt;<animate attributeName="dx" values="0;5;0" dur="1.2s" repeatCount="indefinite"/></tspan></text>
  </g>
  
  <rect x="2" y="2" width="476" height="226" rx="16" fill="none" stroke="#c084fc" stroke-opacity=".25" stroke-width="1.5"/>
  <rect x="2" y="2" width="476" height="226" rx="16" fill="none" stroke="url(#gk)" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="253 1151">
    <animate attributeName="stroke-dashoffset" from="0" to="-1404" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>